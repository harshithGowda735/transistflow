<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanchar Saathi - Live Passenger Bus Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="gov-header">
    <div class="brand-section">
      <img src="/assets/bus_pin.svg" class="brand-logo-img" alt="Sanchar Saathi" />
      <div>
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span class="brand-title">Sanchar Saathi</span>
        </div>
        <div class="gov-subtext">Real-Time Bus Tracking & Transit Operations</div>
      </div>
    </div>
    <div class="header-links">
      <button id="btnDemoSimulate" class="btn" style="background: #ea580c; color: white; padding: 6px 14px; font-size: 12px; font-weight: 800; border-radius: 6px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;" onclick="toggleDemoMode()">
        <span>▶</span> Live Demo Mode
      </button>
      <a href="/index.html" class="nav-link active">Passenger View</a>
      <a href="/admin.html" class="nav-link">Owner Dashboard</a>
      <a href="/driver/index.html" class="nav-link">Driver App</a>
    </div>
  </header>

  
  <div class="app-container">
    
    <aside class="sidebar-panel">
      
      <div class="route-selector-card">
        
        <div style="margin-bottom: 14px;">
          <div class="section-label">Origin Stop</div>
          <div class="search-wrapper">
            <input type="text" id="inputOrigin" class="search-input" value="Majestic KBS" placeholder="Search boarding stop..." onfocus="showOriginDropdown()" oninput="onOriginSearchInput(this.value)" autocomplete="off" />
            <div id="originDropdown" class="autocomplete-dropdown"></div>
          </div>
        </div>

        
        <div class="swap-divider-container">
          <div class="swap-divider-line"></div>
          <button class="swap-circle-btn" onclick="swapLocations()" title="Reverse Route">⇅</button>
        </div>

        
        <div style="margin-top: 14px; margin-bottom: 6px;">
          <div class="section-label">Destination Stop</div>
          <div class="search-wrapper">
            <input type="text" id="inputDest" class="search-input" value="Mysuru Suburb Stand" placeholder="Search destination stop..." onfocus="showDestDropdown()" oninput="onDestSearchInput(this.value)" autocomplete="off" />
            <div id="destDropdown" class="autocomplete-dropdown"></div>
          </div>
        </div>
      </div>

      
      <div id="alertContainer"></div>

      
      <div id="fallbackContainer"></div>

      
      <div style="padding: 16px;">
        <div style="background: var(--bg-subtle); border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--border-color); margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div>
              <div id="busTitle" style="font-size: 16px; font-weight: 800; color: var(--primary-navy);">Bus 23A</div>
              <div id="routeSubtitle" style="font-size: 11px; color: var(--text-muted);">Majestic to Vijayanagar</div>
            </div>
            <span id="statusBadge" class="badge badge-ontime">
              <span class="pulse-dot"></span>
              <span id="statusText">ON TIME</span>
            </span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
            <div>
              <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Estimated Arrival</div>
              <div id="etaDisplay" style="font-size: 20px; font-weight: 900; color: var(--primary-orange);">8 min</div>
              <div id="delayDeltaText" style="font-size: 10px; color: var(--status-ontime); font-weight: 600;">Normal Schedule</div>
            </div>
            <div>
              <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Next Upcoming Stop</div>
              <div id="nextStopDisplay" style="font-size: 13px; font-weight: 700; color: var(--primary-navy); margin-top: 4px;">KR Market</div>
              <div id="distanceDisplay" style="font-size: 10px; color: var(--text-muted);">6.2 km remaining</div>
            </div>
          </div>

          <div style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
            <span>Vehicle Speed:</span>
            <strong id="speedDisplay" style="color: var(--primary-navy);">32 km/h</strong>
          </div>
        </div>

        
        <div>
          <h3 style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px;">Upcoming Stops</h3>
          <div id="stopsList" style="display: flex; flex-direction: column; gap: 10px;">
            
          </div>
        </div>
      </div>
    </aside>

    
    <main class="map-view">
      <div id="map"></div>
    </main>
  </div>

  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/simulation.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/commuter.js"></script>
</body>
</html>
