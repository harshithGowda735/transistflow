<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Pulse Radar Rings Glow -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f87171" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fee2e2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Radar Ripple Circles -->
  <ellipse cx="80" cy="128" rx="64" ry="24" fill="url(#radarGlow)"/>
  <ellipse cx="80" cy="128" rx="44" ry="16" fill="#fca5a5" fill-opacity="0.3" stroke="#f87171" stroke-width="1" stroke-opacity="0.4"/>
  <ellipse cx="80" cy="128" rx="20" ry="8" fill="#dc2626" fill-opacity="0.8"/>

  <!-- Red Pin Body -->
  <g filter="url(#shadow)">
    <!-- Teardrop Pin Shape -->
    <path d="M80 18 C52 18 30 40 30 68 C30 92 56 114 80 130 C104 114 130 92 130 68 C130 40 108 18 80 18 Z" 
          fill="url(#pinGradient)" />
    <!-- Linear Gradient for Pin 3D Sheen -->
    <defs>
      <linearGradient id="pinGradient" x1="30%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#ef4444"/>
        <stop offset="40%" stop-color="#dc2626"/>
        <stop offset="100%" stop-color="#991b1b"/>
      </linearGradient>
    </defs>

    <!-- Inner White Circle -->
    <circle cx="80" cy="64" r="30" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>

    <!-- Red Bus Silhouette Icon -->
    <g fill="#dc2626" transform="translate(80, 64) scale(0.95) translate(-80, -64)">
      <!-- Main Bus Cabin -->
      <rect x="62" y="44" width="36" height="36" rx="6" />
      <!-- Windshield -->
      <rect x="65" y="48" width="30" height="14" rx="3" fill="#ffffff"/>
      <!-- Headlights -->
      <circle cx="68" cy="71" r="3" fill="#ffffff"/>
      <circle cx="92" cy="71" r="3" fill="#ffffff"/>
      <!-- Grille Line -->
      <rect x="74" y="69" width="12" height="2" rx="1" fill="#ffffff"/>
      <rect x="74" y="73" width="12" height="2" rx="1" fill="#ffffff"/>
      <!-- Left & Right Mirrors -->
      <rect x="58" y="52" width="3" height="8" rx="1.5"/>
      <rect x="99" y="52" width="3" height="8" rx="1.5"/>
      <!-- Wheels -->
      <rect x="64" y="78" width="6" height="4" rx="1"/>
      <rect x="90" y="78" width="6" height="4" rx="1"/>
    </g>
  </g>
</svg>
