<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Background & Outer Rings -->
  <circle cx="150" cy="150" r="144" fill="#ffffff" stroke="#ea580c" stroke-width="7"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#ea580c" stroke-width="3"/>
  <circle cx="150" cy="150" r="95" fill="none" stroke="#ea580c" stroke-width="3.5"/>
  <circle cx="150" cy="150" r="90" fill="#ffffff"/>

  <!-- Top Kannada Curved Text: ಕ. ರಾ. ರ. ಸಾ. ನಿ. -->
  <path id="textArcTop" d="M 38,150 A 112,112 0 0,1 262,150" fill="none"/>
  <text fill="#ea580c" font-size="22" font-family="'Inter', Arial, sans-serif" font-weight="900" letter-spacing="9">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ಕ.  ರಾ.  ರ.  ಸಾ.  ನಿ.
    </textPath>
  </text>

  <!-- Side Stars -->
  <g fill="#ea580c">
    <!-- Left Star -->
    <polygon points="38,150 42,143 50,143 44,148 46,156 38,151 30,156 32,148 26,143 34,143" transform="translate(3, -2) scale(0.9)"/>
    <!-- Right Star -->
    <polygon points="262,150 266,143 274,143 268,148 270,156 262,151 254,156 256,148 250,143 258,143" transform="translate(-8, -2) scale(0.9)"/>
  </g>

  <!-- Bottom English Curved Text: K. S. R. T. C. -->
  <path id="textArcBottom" d="M 36,150 A 114,114 0 0,0 264,150" fill="none"/>
  <text fill="#ea580c" font-size="24" font-family="'Inter', Arial, sans-serif" font-weight="900" letter-spacing="11">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      K. S. R. T. C.
    </textPath>
  </text>

  <!-- Center Double-Headed Gandaberunda Motif -->
  <g fill="#ea580c" stroke="#ea580c" stroke-linejoin="round">
    <!-- Crowns/Crests -->
    <path d="M 125,72 C 120,60 132,54 135,64 Z" />
    <path d="M 175,72 C 180,60 168,54 165,64 Z" />
    
    <!-- Left Head & Beak -->
    <path d="M 148,82 C 142,75 130,72 120,80 C 114,84 108,82 108,88 C 114,92 122,90 128,94 C 135,100 144,102 148,105 Z" />
    <circle cx="128" cy="85" r="3.5" fill="#ffffff" stroke="none"/>
    
    <!-- Right Head & Beak -->
    <path d="M 152,82 C 158,75 170,72 180,80 C 186,84 192,82 192,88 C 186,92 178,90 172,94 C 165,100 156,102 152,105 Z" />
    <circle cx="172" cy="85" r="3.5" fill="#ffffff" stroke="none"/>
    
    <!-- Central Neck Junction & Heart Body -->
    <path d="M 150,96 C 142,106 132,118 132,135 C 132,154 140,168 150,178 C 160,168 168,154 168,135 C 168,118 158,106 150,96 Z" fill="#ea580c"/>
    <circle cx="150" cy="148" r="4.5" fill="#ffffff" stroke="none"/>

    <!-- Left Wing Feathers -->
    <path d="M 132,118 C 118,102 96,105 82,122 C 72,135 68,154 70,175 C 84,172 98,178 106,192 C 114,180 122,165 130,154 C 122,142 126,128 132,118 Z"/>
    <path d="M 92,128 C 98,142 105,155 118,162 C 110,150 102,138 92,128 Z" fill="#ffffff" stroke="none"/>

    <!-- Right Wing Feathers -->
    <path d="M 168,118 C 182,102 204,105 218,122 C 228,135 232,154 230,175 C 216,172 202,178 194,192 C 186,180 178,165 170,154 C 178,142 174,128 168,118 Z"/>
    <path d="M 208,128 C 202,142 195,155 182,162 C 190,150 198,138 208,128 Z" fill="#ffffff" stroke="none"/>

    <!-- Tail Feathers Fan -->
    <path d="M 138,180 L 126,215 L 138,212 L 145,222 L 150,210 L 155,222 L 162,212 L 174,215 L 162,180 Z" />
    <line x1="150" y1="180" x2="150" y2="210" stroke="#ffffff" stroke-width="2"/>
    <line x1="144" y1="184" x2="136" y2="208" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="156" y1="184" x2="164" y2="208" stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>
